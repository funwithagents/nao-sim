[project]
name = "nao-sim"
version = "0.0.1"
description = "A NAO in a box: NAOqi in Docker with host-side devices (sound card, camera, viewer)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "sounddevice",
]

[project.scripts]
nao-sim-soundcard = "nao_sim.soundcard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nao_sim"]
