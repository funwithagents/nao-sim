[project]
name = "nao-sim"
version = "0.0.1"
description = "A NAO in a box: NAOqi in Docker with host-side devices (audio, video, touch) and a viewer."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # capped by the libqi wheels (cp312, cp313)
license = { text = "MIT" }
dependencies = [
    "numpy",
    "platformdirs",
    "qi==3.1.6",
    "sounddevice",
]

[project.optional-dependencies]
# The sim window and the render camera (specs/host/viewer.md).
viewer = ["nao-viewer"]

[project.scripts]
nao-sim = "nao_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package, and the container recipes as its package data (specs/project.md, "Distribution"):
# all of docker/ but the vendor files, which are Aldebaran's and never leave the machine.
only-include = ["src/nao_sim", "docker"]
exclude = ["docker/vendor", "__pycache__", "*.pyc"]
# hatch cannot make an editable install from a remapped path: a checkout puts src/ on the path
# and uses docker/ where it is.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src/nao_sim" = "nao_sim"
"docker" = "nao_sim/docker"

[dependency-groups]
dev = [
    "nao-sim[viewer]",  # the viewer code type-checks against nao-viewer's real API
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# libqi Python 3 wheels come from the GitHub Releases of the funwithagents fork, not PyPI
# (PyPI's `qi` is Aldebaran's older 3.1.5). Only macOS arm64 and Linux x86_64 wheels exist.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# nao-viewer is not on PyPI yet (specs/project.md, open question 1): its repository, pinned.
nao-viewer = { git = "https://github.com/funwithagents/nao-viewer", rev = "db0b59cc2e2875a15e01d206c87f1b181bc4ae01" }
qi = [
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp312-cp312-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.12'" },
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp313-cp313-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.13'" },
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp312-cp312-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12'" },
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp313-cp313-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.13'" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python
# docker/modules/ is Python 2.7 running inside NAOqi (naoqi, qi, urllib2): not linted here.
# spike/ holds local, untracked investigation scripts.
extend-exclude = ["docker/modules", "spike"]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# Host-side tests import the container code by module name (tests/conftest.py adds these to sys.path).
extraPaths = ["docker/modules", "docker/tts"]
typeCheckingMode = "standard"
