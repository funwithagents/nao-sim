# The project is always `nao-sim` (containers, network, the package store volumes).
name: nao-sim

services:
  tts:
    build:
      context: ./tts
      labels:
        io.nao-sim.version: ${NAO_SIM_VERSION:-dev}
        io.nao-sim.recipes: ${NAO_SIM_RECIPES:-}
    image: nao-sim/tts:dev
    container_name: nao-sim-tts
    environment:
      NAO_SIM_SOUNDCARD: host.docker.internal:9562
      NAO_SIM_TTS_ENGINE: ${NAO_SIM_TTS_ENGINE:-piper}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  naoqi21:
    profiles: ["2.1"]
    build:
      context: .
      dockerfile: Dockerfile.naoqi-2.1
      # The suite and animations.pkg (COPY --from=image-data): the image data folder nao-sim passes as
      # NAO_SIM_IMAGE_DATA, or a checkout's ./image-data when compose runs by hand.
      additional_contexts:
        image-data: ${NAO_SIM_IMAGE_DATA:-./image-data}/2.1
      args:
        NAO_SIM_VERSION: ${NAO_SIM_VERSION:-dev}
      labels:
        io.nao-sim.version: ${NAO_SIM_VERSION:-dev}
        io.nao-sim.recipes: ${NAO_SIM_RECIPES:-}
    image: nao-sim/naoqi:2.1.4.13
    platform: linux/amd64
    container_name: nao-sim-naoqi21
    environment:
      NAO_SIM_TTS_URL: http://tts:8080
    depends_on: [tts]
    ports:
      - "127.0.0.1:9559:9559"
    volumes:
      - packages-2.1:/home/nao/.local/share/PackageManager
    extra_hosts:
      - "host.docker.internal:host-gateway"
  naoqi28:
    profiles: ["2.8"]
    build:
      context: .
      dockerfile: Dockerfile.naoqi-2.8
      # The suite and animations.pkg (COPY --from=image-data): the image data folder nao-sim passes as
      # NAO_SIM_IMAGE_DATA, or a checkout's ./image-data when compose runs by hand.
      additional_contexts:
        image-data: ${NAO_SIM_IMAGE_DATA:-./image-data}/2.8
      args:
        NAO_SIM_VERSION: ${NAO_SIM_VERSION:-dev}
      labels:
        io.nao-sim.version: ${NAO_SIM_VERSION:-dev}
        io.nao-sim.recipes: ${NAO_SIM_RECIPES:-}
    image: nao-sim/naoqi:2.8.7.4
    platform: linux/amd64
    container_name: nao-sim-naoqi28
    environment:
      NAO_SIM_TTS_URL: http://tts:8080
    depends_on: [tts]
    ports:
      - "127.0.0.1:9559:9559"
    volumes:
      - packages-2.8:/home/nao/.local/share/PackageManager
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Package stores (PackageManager's apps/ and pm.db), one per version: packages installed over qi
# or Choregraphe survive `docker compose down`; `down -v` resets to the image's factory packages.
volumes:
  packages-2.1:
  packages-2.8:
